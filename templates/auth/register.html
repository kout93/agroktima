{% extends "base.html" %}
{% block title %}Εγγραφή — Αγρόκτημα{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto;">
  <h1>Δημιουργία λογαριασμού</h1>
  <form method="post">
    <label>Όνομα</label>
    <input type="text" name="name" required>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Κωδικός</label>
    <input type="password" name="password" required minlength="6">
    <label>Είσαι...</label>
    <select name="role" required>
      <option value="">— Επίλεξε —</option>
      <option value="farmer">Αγρότης / Παραγωγός</option>
      <option value="customer">Πελάτης (θέλω να υιοθετήσω δέντρο)</option>
    </select>
    <button class="btn" type="submit">Εγγραφή</button>
  </form>
  <p style="margin-top:16px;">Έχεις ήδη λογαριασμό; <a href="{{ url_for('auth.login') }}">Σύνδεση</a></p>
</div>
{% endblock %}
