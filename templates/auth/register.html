{% extends "base.html" %}
{% block title %}{{ _('Εγγραφή') }} — {{ _('Αγρόκτημα') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto;">
  <h1>{{ _('Δημιουργία νέου λογαριασμού') }}</h1>
  <form method="post">
    <label>{{ _('Όνομα') }}</label>
    <input type="text" name="name" required>
    <label>{{ _('Email') }}</label>
    <input type="email" name="email" required>
    <label>{{ _('Κωδικός') }}</label>
    <input type="password" name="password" required minlength="6">
    <label>{{ _('Είσαι...') }}</label>
    <select name="role" required>
      <option value="">— {{ _('Επίλεξε') }} —</option>
      <option value="farmer">{{ _('Αγρότης / Παραγωγός') }}</option>
      <option value="customer">{{ _('Πελάτης (θέλω να υιοθετήσω δέντρο)') }}</option>
    </select>
    <button class="btn" type="submit">{{ _('Εγγραφή') }}</button>
  </form>
  <p style="margin-top:16px;">{{ _('Έχεις ήδη λογαριασμό;') }} <a href="{{ url_for('auth.login') }}">{{ _('Σύνδεση') }}</a></p>
</div>
{% endblock %}
