{% extends "base.html" %}
{% block title %}Σύνδεση — Αγρόκτημα{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto;">
  <h1>Σύνδεση</h1>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Κωδικός</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">Σύνδεση</button>
  </form>
  <p style="margin-top:16px;">Δεν έχεις λογαριασμό; <a href="{{ url_for('auth.register') }}">Εγγραφή</a></p>
</div>
{% endblock %}
