{% extends "base.html" %}
{% block title %}{{ _('Σύνδεση') }} — {{ _('Αγρόκτημα') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto;">
  <h1>{{ _('Σύνδεση λογαριασμού') }}</h1>
  <form method="post">
    <label>{{ _('Email') }}</label>
    <input type="email" name="email" required>
    <label>{{ _('Κωδικός') }}</label>
    <input type="password" name="password" required>
    <button class="btn" type="submit">{{ _('Σύνδεση') }}</button>
  </form>
  <p style="margin-top:16px;">{{ _('Δεν έχεις λογαριασμό;') }} <a href="{{ url_for('auth.register') }}">{{ _('Εγγραφή') }}</a></p>
</div>
{% endblock %}
